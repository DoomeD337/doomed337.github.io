<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#858a90"/>
      <stop offset=".12" stop-color="#f5f6f7"/>
      <stop offset=".28" stop-color="#b8bcc1"/>
      <stop offset=".48" stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#a4a8ad"/>
      <stop offset="1" stop-color="#d8dbdf"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4a4d51" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="56%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#fff" flood-opacity=".16"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <g transform="translate(350 350)">
    <circle r="240" fill="url(#halo)" opacity=".62" filter="url(#blur)"/>
    <circle r="230" fill="none" stroke="#c8ccd0" stroke-opacity=".18" stroke-width="1.4"/>
    <circle r="196" fill="none" stroke="#d6dade" stroke-opacity=".18" stroke-width="1" stroke-dasharray="5 8"/>
    <text x="0" y="40" text-anchor="middle" font-size="240" font-weight="800" font-family="Arial, Helvetica, sans-serif" letter-spacing="-18" fill="url(#metal)" filter="url(#shadow)">ВР</text>
    <text x="0" y="40" text-anchor="middle" font-size="240" font-weight="800" font-family="Arial, Helvetica, sans-serif" letter-spacing="-18" fill="none" stroke="url(#edge)" stroke-width="4">ВР</text>
    <text x="0" y="-8" text-anchor="middle" font-size="240" font-weight="800" font-family="Arial, Helvetica, sans-serif" letter-spacing="-18" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="16">ВР</text>
    <path d="M-145 278H145" stroke="#adb2b6" stroke-opacity=".35" stroke-width="1"/>
    <text x="0" y="305" text-anchor="middle" fill="#8b9095" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="7">VRODE ROVNO / MONOGRAM SIGNAL</text>
  </g>
</svg>
